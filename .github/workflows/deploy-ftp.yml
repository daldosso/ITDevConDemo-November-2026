name: Deploy demo via FTP

on:
  workflow_dispatch:
    inputs:
      remote_path:
        description: Remote FTP directory, for example /itdevcon-demo
        required: true
        default: /itdevcon-demo
        type: string

permissions:
  contents: read

jobs:
  deploy-ftp:
    # Configure the ftp-demo Environment with FTP_URL (variable) and
    # FTP_USERNAME / FTP_PASSWORD (secrets) before running this workflow.
    runs-on: [self-hosted, windows, delphi]
    environment:
      name: ftp-demo

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build Release executable
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $rsvars = 'C:\Program Files (x86)\Embarcadero\Studio\37.0\bin\rsvars.bat'
          if (-not (Test-Path -LiteralPath $rsvars)) {
            throw "Delphi 13 environment script not found: $rsvars"
          }
          cmd /c "call `"$rsvars`" && msbuild ITDevConDemo.dproj /t:Build /p:Config=Release /p:Platform=Win64 /v:minimal"

      - name: Upload executable by FTP
        shell: pwsh
        env:
          FTP_URL: ${{ vars.FTP_URL }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
          REMOTE_PATH: ${{ inputs.remote_path }}
        run: |
          $ErrorActionPreference = 'Stop'
          if ([string]::IsNullOrWhiteSpace($env:FTP_URL) -or [string]::IsNullOrWhiteSpace($env:FTP_USERNAME) -or [string]::IsNullOrWhiteSpace($env:FTP_PASSWORD)) {
            throw 'Configure FTP_URL plus FTP_USERNAME and FTP_PASSWORD in the ftp-demo Environment before deploying.'
          }
          $sourceExe = Join-Path $env:GITHUB_WORKSPACE 'Win64\Release\ITDevConDemo.exe'
          $remoteUrl = "$($env:FTP_URL.TrimEnd('/'))/$($env:REMOTE_PATH.Trim('/'))/ITDevConDemo.exe"
          curl.exe --fail --silent --show-error --ftp-create-dirs --user "$($env:FTP_USERNAME):$($env:FTP_PASSWORD)" --upload-file $sourceExe $remoteUrl
