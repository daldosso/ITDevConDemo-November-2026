name: Deploy demo

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      target_environment:
        description: Environment to deploy
        required: true
        default: development
        type: choice
        options:
          - development
          - staging
          - production

permissions:
  contents: read

concurrency:
  group: deploy-demo
  cancel-in-progress: false

jobs:
  smoke-test:
    name: Smoke test staged API
    runs-on: [self-hosted, windows, delphi]
    environment:
      name: ${{ inputs.target_environment || 'development' }}
    env:
      DEMO_API_TOKEN: ${{ secrets.DEMO_API_TOKEN }}

    steps:
      - name: Start API and verify core endpoints
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $sourceExe = 'C:\ITDevCon-demo\build-input\ITDevConDemo.exe'
          $port = 18080
          $baseUrl = "http://localhost:$port/api"

          if (-not (Test-Path -LiteralPath $sourceExe -PathType Leaf)) {
            throw "IDE build input not found: $sourceExe. Run the 'Package IDE build' workflow after compiling in Delphi."
          }
          if ([string]::IsNullOrWhiteSpace($env:DEMO_API_TOKEN)) {
            throw 'The DEMO_API_TOKEN secret is not configured for this GitHub Environment.'
          }
          if (Get-NetTCPConnection -LocalPort $port -State Listen -ErrorAction SilentlyContinue) {
            throw "Test port $port is already in use."
          }

          $env:ITDEVCON_PORT = $port
          $process = Start-Process -FilePath $sourceExe -PassThru -WindowStyle Hidden
          try {
            $deadline = (Get-Date).AddSeconds(20)
            do {
              try {
                $hello = Invoke-RestMethod -Uri "$baseUrl/hello" -TimeoutSec 2
                break
              } catch {
                Start-Sleep -Milliseconds 500
              }
            } while ((Get-Date) -lt $deadline)

            if ($null -eq $hello) { throw 'API did not become ready within 20 seconds.' }
            if ($hello.message -ne 'Hello ITDevCon!') { throw "Unexpected /hello response: $($hello | ConvertTo-Json -Compress)" }

            $users = Invoke-RestMethod -Uri "$baseUrl/users" -TimeoutSec 5
            if ($users.Count -lt 10) { throw "Expected at least 10 users, got $($users.Count)." }

            $authenticatedUser = Invoke-RestMethod -Uri "$baseUrl/users-auth/1" -Headers @{ Authorization = "Bearer $env:DEMO_API_TOKEN" } -TimeoutSec 5
            if ($authenticatedUser.auth -ne 'ok') { throw 'Authenticated endpoint did not confirm the token.' }

            $activity = Invoke-RestMethod -Uri "$baseUrl/activities/301" -TimeoutSec 5
            if ($activity.id -ne 301 -or $activity.map.resource_state -ne 3) {
              throw "Unexpected activity response: $($activity | ConvertTo-Json -Depth 5 -Compress)"
            }
            Write-Host 'API smoke tests passed, including the authenticated endpoint.'
          } finally {
            if (-not $process.HasExited) {
              Stop-Process -Id $process.Id -Force
            }
          }

  deploy:
    # The runner is also the simulated deployment machine for the talk.
    needs: smoke-test
    runs-on: [self-hosted, windows, delphi]
    environment:
      name: ${{ inputs.target_environment || 'development' }}
    env:
      DEPLOYMENT_ENVIRONMENT: ${{ inputs.target_environment || 'development' }}

    steps:
      - name: Verify IDE build input
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $sourceExe = 'C:\ITDevCon-demo\build-input\ITDevConDemo.exe'
          if (-not (Test-Path -LiteralPath $sourceExe)) {
            throw "IDE build input not found: $sourceExe. Run the 'Package IDE build' workflow after compiling in Delphi."
          }

      - name: Deploy to the local demo folder
        shell: pwsh
        env:
          RELEASE_ID: ${{ github.run_number }}-${{ github.sha }}
        run: |
          $ErrorActionPreference = 'Stop'
          $deployRoot = Join-Path 'C:\ITDevCon-demo\environments' $env:DEPLOYMENT_ENVIRONMENT
          $releaseId = $env:RELEASE_ID
          $releaseDir = Join-Path $deployRoot "releases\$releaseId"
          $currentDir = Join-Path $deployRoot 'current'
          $sourceExe = 'C:\ITDevCon-demo\build-input\ITDevConDemo.exe'

          if (-not (Test-Path -LiteralPath $sourceExe)) {
            throw "Release executable not found: $sourceExe"
          }

          # A deploy is reversible: archive the active version before promotion.
          if (Test-Path -LiteralPath $currentDir) {
            $backupDir = Join-Path $deployRoot 'backups'
            New-Item -ItemType Directory -Force -Path $backupDir | Out-Null
            $backupFile = Join-Path $backupDir "before-$releaseId.zip"
            Compress-Archive -Path (Join-Path $currentDir '*') -DestinationPath $backupFile -CompressionLevel Optimal -Force
          }

          New-Item -ItemType Directory -Force -Path $releaseDir | Out-Null
          Copy-Item -LiteralPath $sourceExe -Destination $releaseDir -Force
          @{
            release_id = $releaseId
            commit = $env:GITHUB_SHA
            deployed_at_utc = (Get-Date).ToUniversalTime().ToString('o')
          } | ConvertTo-Json | Set-Content -LiteralPath (Join-Path $releaseDir 'release.json') -Encoding utf8

          # "current" is the folder the server/operator would run in production.
          if (Test-Path -LiteralPath $currentDir) {
            Remove-Item -LiteralPath $currentDir -Recurse -Force
          }
          Copy-Item -LiteralPath $releaseDir -Destination $currentDir -Recurse -Force

          if (-not (Test-Path -LiteralPath (Join-Path $currentDir 'ITDevConDemo.exe'))) {
            throw 'Deployment verification failed: current executable is missing.'
          }
          Get-ChildItem -LiteralPath $currentDir | Select-Object Name, Length

      - name: Publish deployment package
        uses: actions/upload-artifact@v4
        with:
          name: ITDevConDemo-deployed-${{ github.run_number }}
          path: C:\ITDevCon-demo\current
          if-no-files-found: error
