name: Delphi build

on:
  workflow_dispatch:
    inputs:
      configuration:
        description: Build configuration
        required: true
        default: Debug
        type: choice
        options:
          - Debug
          - Release

permissions:
  contents: read

jobs:
  build:
    # A self-hosted runner is intentional: Delphi is licensed software and is
    # not installed on GitHub-hosted runners.
    runs-on: [self-hosted, windows, delphi]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Restore DelphiMVCFramework and LoggerPro
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          New-Item -ItemType Directory -Force -Path modules | Out-Null
          git clone --depth 1 --branch v3.5.0-silicon-rc9 https://github.com/danieleteti/delphimvcframework.git modules/dmvcframework
          git clone --depth 1 --branch v2.1.2 https://github.com/danieleteti/loggerpro.git modules/loggerpro

      - name: Build Win64 executable
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $rsvars = 'C:\Program Files (x86)\Embarcadero\Studio\37.0\bin\rsvars.bat'
          if (-not (Test-Path -LiteralPath $rsvars)) {
            throw "Delphi 13 environment script not found: $rsvars"
          }
          cmd /c "call `"$rsvars`" && msbuild ITDevConDemo.dproj /t:Build /p:Config=${{ inputs.configuration }} /p:Platform=Win64 /v:minimal"

      - name: Upload executable
        uses: actions/upload-artifact@v4
        with:
          name: ITDevConDemo-${{ inputs.configuration }}-Win64
          path: Win64/${{ inputs.configuration }}/ITDevConDemo.exe
          if-no-files-found: error
