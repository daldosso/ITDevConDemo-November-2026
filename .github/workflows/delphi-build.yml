name: Package IDE build

on:
  workflow_dispatch:
    inputs:
      source_executable:
        description: Executable produced by the Delphi IDE
        required: true
        default: C:\dev\Personal\ITDevConDemo-November-2026\Win64\Debug\ITDevConDemo.exe
        type: string

permissions:
  contents: read

jobs:
  package:
    # Delphi Community Edition builds in the IDE; this job packages its output.
    runs-on: [self-hosted, windows, delphi]
    environment:
      name: demo

    steps:
      - name: Stage the executable built by the IDE
        shell: pwsh
        env:
          SOURCE_EXECUTABLE: ${{ inputs.source_executable }}
        run: |
          $ErrorActionPreference = 'Stop'
          $sourceExe = $env:SOURCE_EXECUTABLE
          $stagingDir = 'C:\ITDevCon-demo\build-input'
          $stagedExe = Join-Path $stagingDir 'ITDevConDemo.exe'

          if (-not (Test-Path -LiteralPath $sourceExe -PathType Leaf)) {
            throw "IDE executable not found: $sourceExe"
          }
          New-Item -ItemType Directory -Force -Path $stagingDir | Out-Null
          Copy-Item -LiteralPath $sourceExe -Destination $stagedExe -Force
          Get-FileHash -LiteralPath $stagedExe -Algorithm SHA256 |
            Select-Object Algorithm, Hash, Path | ConvertTo-Json |
            Set-Content -LiteralPath (Join-Path $stagingDir 'build.json') -Encoding utf8

      - name: Upload staged executable
        uses: actions/upload-artifact@v4
        with:
          name: ITDevConDemo-IDE-build-${{ github.run_number }}
          path: |
            C:\ITDevCon-demo\build-input\ITDevConDemo.exe
            C:\ITDevCon-demo\build-input\build.json
          if-no-files-found: error
